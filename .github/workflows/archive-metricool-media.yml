name: Archive Metricool post thumbnails
on:
  push:
    branches: [main]
    paths:
      - media-archive-manifest.json
      - scripts/archive-media.mjs
      - .github/workflows/archive-metricool-media.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signal-media-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out SIGNAL
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify archive script
        run: node --check scripts/archive-media.mjs
      - name: Download real Metricool images
        run: node scripts/archive-media.mjs
      - name: Commit permanent thumbnails
        run: |
          git config user.name "signal-media-bot"
          git config user.email "signal-media-bot@users.noreply.github.com"
          git add public/media/archive
          if git diff --cached --quiet; then
            echo "No new media files"
          else
            git commit -m "Archive published OPUS post and Story thumbnail files"
            git push origin HEAD:main
          fi
